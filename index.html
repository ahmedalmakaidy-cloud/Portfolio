<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed Almakaidy · Bilingual Copywriter</title>
<meta name="description" content="Ahmed, bilingual copywriter (English and Italian). Emails, sales pages and landing pages that move people to the next step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@1,7..72,400&display=swap">
<style>
/* Layout B: warm hero with portrait, three alternating case studies with real page images, then a page-thumbnail gallery */
:root{
  --bg:#F5EFE6; --surface:#FBF8F3; --ink:#2B2118; --muted:#6E5F52; --line:#E2D6C5;
  --sun:#7A4E31; --peach:#EADCC8; --en:#3A5E99; --it:#2F7D57; --desk:#E8DCCB;
  --display:"Fraunces",Georgia,serif;
  --ui:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
img.doc{user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--sun)}
.top-r{display:flex;align-items:center;gap:22px}
.top nav{display:flex;gap:20px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.top nav a:hover{color:var(--ink)}
.switch{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px}
.switch button{font:600 13px var(--ui);letter-spacing:.06em;border:0;background:none;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--peach);border-radius:28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:40px;align-items:center;padding:60px 56px;margin-top:6px}
.hero::before{content:"";position:absolute;width:560px;height:560px;right:-140px;bottom:-280px;background:radial-gradient(circle,rgba(190,140,95,.35),rgba(190,140,95,0) 65%);pointer-events:none}
.hero > *{position:relative}
.hero h1{font-size:clamp(34px,5vw,62px);font-weight:700;letter-spacing:-.015em;margin-top:14px}
.hero .lede{color:#5E4E45;max-width:52ch;margin:20px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--ui);padding:13px 22px;border-radius:999px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:transform .15s}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#fff}
.btn:hover{transform:translateY(-2px)}
.portrait{justify-self:end;width:100%;max-width:320px}
.portrait figure{margin:0;position:relative}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:8px solid #fff;box-shadow:0 20px 40px -18px rgba(90,50,20,.45);transform:rotate(2deg)}
.portrait figcaption{position:absolute;left:-18px;bottom:22px;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 10px 26px rgba(90,50,20,.18);display:flex;gap:8px;align-items:center;white-space:nowrap}
.portrait figcaption i{width:8px;height:8px;border-radius:50%;background:#3BBF6E;flex:none}

section{padding-block:72px 8px}
.sec-head{display:grid;gap:8px;margin-bottom:36px}
.sec-head h2{font-size:clamp(30px,4.2vw,46px);font-weight:800;letter-spacing:-.02em}
.lang{font-size:11px;font-weight:600;letter-spacing:.08em;border:1.5px solid currentColor;border-radius:5px;padding:1px 6px;white-space:nowrap}
.lang.EN{color:var(--en)} .lang.IT{color:var(--it)}

/* case studies */
.cases{display:grid;gap:72px}
.case{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.case:nth-child(even) .stack{order:2}
.stack{position:relative;background:var(--desk);border-radius:24px;padding:34px 28px;min-height:420px;display:flex;justify-content:center;align-items:center;cursor:pointer;border:0;width:100%;font:inherit}
.stack .pgs{position:relative;width:min(54%,270px);aspect-ratio:816/1056}
.stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;box-shadow:0 14px 30px -14px rgba(90,50,20,.45);background:#fff;transition:transform .25s}
.stack img:nth-child(1){transform:rotate(-7deg) translate(-26%,4%)}
.stack img:nth-child(2){transform:rotate(5deg) translate(24%,2%)}
.stack img:nth-child(3){transform:rotate(-1deg)}
.stack:hover img:nth-child(1){transform:rotate(-9deg) translate(-32%,4%)}
.stack:hover img:nth-child(2){transform:rotate(7deg) translate(30%,2%)}
.stack .open{position:absolute;bottom:16px;right:16px;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 16px rgba(90,50,20,.15)}
.story{display:grid;gap:16px}
.story .num{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);font-weight:500}
.story .num b{font-family:var(--display);font-size:15px;color:var(--sun)}
.story h3{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.015em}
.kv{display:grid;gap:14px;margin:0}
.kv div{display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.kv dt{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-size:16.5px}
.story .btn{justify-self:start;margin-top:6px}

/* trusted by */
.trusted{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:26px 8px 0}
.trusted .t-label{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trusted ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px 34px}
.trusted li{display:flex;align-items:center;gap:8px}
.trusted li img{display:block;width:auto}
.trusted li.pi span{font:600 16px var(--ui);color:#1F6F86;letter-spacing:-.01em}
@media (max-width:600px){.trusted ul{gap:12px 24px}.trusted li img[height="26"]{height:22px}.trusted li.pi img{height:30px}.trusted li.pi span{font-size:14px}.trusted li img[height="19"]{height:16px}}
/* language tabs */
.langtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
.langtab{font:600 14.5px var(--ui);padding:9px 16px;border-radius:999px;border:1.5px solid;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;transition:background .15s,color .15s}
.langtab.ALL{border-color:var(--line);background:var(--surface);color:var(--ink)}
.langtab.ALL[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.langtab.EN{border-color:#C9D6EC;background:#EEF3FB;color:var(--en)}
.langtab.IT{border-color:#C6E2D1;background:#EBF6EF;color:var(--it)}
.langtab.EN[aria-selected="true"]{background:var(--en);border-color:var(--en);color:#fff}
.langtab.IT[aria-selected="true"]{background:var(--it);border-color:var(--it);color:#fff}
.langtab[aria-selected="true"] .lang{color:#fff}
.subhead{font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;margin:0 0 28px}
.subhead.more{margin-top:80px;margin-bottom:18px}
@media (max-width:520px){.langtabs{gap:6px;flex-wrap:nowrap}.langtab{font-size:13px;padding:8px 11px;white-space:nowrap}.langtab .lang{display:none}}
/* more work */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:500 14px var(--ui);padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gallery{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tile button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:12px;width:100%}
.tile .thumb{background:var(--desk);border-radius:16px;padding:18px 18px 0;aspect-ratio:4/3;overflow:hidden;transition:background .2s}
.tile .thumb img{display:block;width:100%;border-radius:4px 4px 0 0;box-shadow:0 10px 24px -14px rgba(90,50,20,.5);transition:transform .25s}
.tile button:hover .thumb img{transform:translateY(-6px)}
.tile button:focus-visible .thumb{outline:2px solid var(--sun);outline-offset:3px}
.tile .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tile .t{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.tile .job{font-size:14.5px;color:var(--muted)}
.also{margin-top:28px;padding:18px 22px;border:1px dashed var(--line);border-radius:16px;font-size:14.5px;color:var(--muted)}
.also b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* reviews */
.rev-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.rev{flex:0 1 calc((100% - 40px)/3);min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;margin:0;display:flex;flex-direction:column;gap:14px}
.rev .body{flex:1;display:grid;gap:6px;align-content:start}
.rev q.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.rev .more{justify-self:start;font:600 14px var(--ui);color:var(--sun);background:none;border:0;padding:0;cursor:pointer}
.rev q{quotes:none;font-size:16px;line-height:1.65}
.rev .tr{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:-4px}
.rev .tr b{font-weight:600}
.rev .stars{color:#E8A317;letter-spacing:2px;font-size:15px}
.rev .who{display:flex;gap:12px;align-items:center}
.rev .av{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font:700 16px var(--display);color:#fff;background:var(--sun)}
.rev .av img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.rev .who b{display:block;font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.2}
.rev .who small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:5px;width:max-content}
.src.linkedin{background:#0A66C2;color:#fff}.src.fiverr{background:#1DBF73;color:#fff}.src.other{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
@media (max-width:980px){.rev{flex-basis:calc((100% - 20px)/2)}}
@media (max-width:600px){.rev{flex-basis:100%;padding:20px}}
.rev .stars{font-size:13px;letter-spacing:1px;margin-left:2px}
/* about */
.about{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:center}
.about-photo{margin:0;max-width:340px}
.about-photo img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:18px;border:8px solid #fff;box-shadow:0 20px 40px -18px rgba(90,50,20,.45);transform:rotate(-2deg)}
.about-text .hi{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.8vw,32px);line-height:1.15;letter-spacing:-.01em}
.about p{margin:0 0 16px;max-width:60ch}
.svc{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.svc li{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;gap:2px}
.svc b{font-family:var(--display);font-weight:600;font-size:18px}
.svc span{font-size:15px;color:var(--muted)}

/* contact */
.contact{margin-block:80px 24px;background:var(--peach);border-radius:28px;padding:56px;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;width:420px;height:420px;left:-140px;top:-220px;background:radial-gradient(circle,rgba(255,170,110,.5),rgba(255,170,110,0) 65%)}
.contact > *{position:relative}
.contact h2{font-size:clamp(30px,4.6vw,54px);font-weight:800;letter-spacing:-.02em;max-width:18ch;margin-top:10px}
.mailbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.addr{font-size:17px;padding:12px 18px;border:1px solid rgba(42,33,29,.2);background:rgba(255,255,255,.6);border-radius:999px;user-select:all;word-break:break-all}
footer{padding-block:20px 36px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.foot-links{display:flex;gap:8px}
.fsoc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s}
.fsoc:hover{transform:translateY(-2px)}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.soc{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--ui);text-decoration:none;padding:10px 18px 10px 14px;border-radius:999px;color:#fff;transition:transform .15s,box-shadow .15s}
.soc:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(0,0,0,.35)}
.upwork{background:#14A800}.fiverr{background:#1DBF73}.linkedin{background:#0A66C2}
.instagram{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF)}

/* viewer */
dialog{border:none;padding:0;background:var(--desk);color:var(--ink);border-radius:20px;width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 30px 90px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(30,20,14,.6)}
.v-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.v-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.v-top h3{font-size:21px;font-weight:600}
.v-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:4px}
.close{flex:none;font:500 14px var(--ui);background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:7px 14px;cursor:pointer}
.v-docs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.v-docs button{flex:none;font:500 13.5px var(--ui);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.v-docs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.v-pages{padding:22px;display:grid;gap:18px;justify-items:center}
.v-pages img{width:100%;max-width:816px;height:auto;border-radius:4px;box-shadow:0 10px 30px -14px rgba(90,50,20,.45);background:#fff}

@media (max-width:880px){
  .hero{grid-template-columns:1fr;padding:34px 22px 32px;gap:30px}
  .portrait{justify-self:start;max-width:240px;order:-1;margin-bottom:10px}
  .portrait figcaption{left:14px;bottom:-16px}
  .case,.about{grid-template-columns:1fr;gap:24px}
  .about-photo{max-width:240px}
  .case:nth-child(even) .stack{order:0}
  .stack{min-height:330px;padding:26px 18px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .top nav{display:none}
  .contact{padding:36px 24px}
  .v-pages{padding:12px;gap:12px}
}
@media (max-width:520px){ .gallery{grid-template-columns:1fr} .tile .thumb{aspect-ratio:16/11} }

/* bento of copy types */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:300px 300px;gap:18px;margin-bottom:18px}
.bc{all:unset;box-sizing:border-box;cursor:pointer;border-radius:24px;padding:26px;display:flex;flex-direction:column;overflow:hidden;background:var(--desk);color:var(--ink);transition:transform .15s,box-shadow .15s}
.bc:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(70,40,15,.35)}
.bc:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.bc .n{font:600 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.bc .t{font:600 26px/1.15 var(--display);margin-top:6px}
.bc .s{color:#5C4A3B;margin-top:6px;font-size:15px}
.bc .shots{display:flex;gap:16px;margin-top:22px;flex:1;min-height:0;align-items:flex-start}
.bc .shots img{flex:1;min-width:0;height:auto;border-radius:10px;box-shadow:0 10px 24px rgba(60,35,15,.14)}
.bc.big{grid-column:span 2;grid-row:span 2;background:var(--surface);border:1px solid var(--line)}
.bc.big .t{font-size:36px}
.bc.big .shots img:first-child{transform:rotate(-2deg)} .bc.big .shots img:last-child{transform:rotate(2deg) translateY(14px)}
.bc.wide{grid-column:span 2;background:var(--sun);color:#FBF8F3;flex-direction:row;gap:20px}
.bc.wide .n{color:#F1D9BE} .bc.wide .s{color:#F1E4D3}
.bc.wide .shots{flex:0 0 200px;margin:0 0 -70px}
.bc.bar{grid-column:1/-1;grid-row:auto;flex-direction:row;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);padding:22px 28px}
.bc.bar .t{margin:0}
.bc.bar .go{font-weight:600;color:var(--sun)}
.bc[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun)}
.cv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin:56px 0 28px;padding-top:28px;border-top:1px solid var(--line)}
.cv-head h3{font:600 clamp(26px,3vw,34px)/1.1 var(--display);margin:0}
.cv-head .langtabs{margin:0}
.cv-all{font:600 14px var(--ui);padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cv-empty{padding:22px;border-radius:16px;background:var(--desk);color:#5C4A3B}
.cases:not(:empty){margin-bottom:64px}
@media (max-width:880px){
  .bento{grid-template-columns:1fr;grid-template-rows:none}
  .bc,.bc.big,.bc.wide,.bc.bar{grid-column:auto;grid-row:auto}
  .bc.big .shots{height:260px;flex:none}
  .bc .shots{height:200px;flex:none}
  .bc.wide{flex-direction:column} .bc.wide .shots{flex:none;margin:0;height:200px}
  .bc.bar{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#top" id="top">Ahmed Almakaidy<span>.</span></a>
    <div class="top-r">
      <nav><a href="#work" data-i="navWork"></a><a href="#reviews" data-i="navR"></a><a href="#about" data-i="navA"></a><a href="#contact" data-i="navC"></a></nav>
      <div class="switch" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="it">IT</button></div>
    </div>
  </header>

  <div class="hero">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p class="lede" data-i="lede"></p>
      <div class="btns"><a class="btn sun" href="#work" data-i="ctaWork"></a><a class="btn" href="#contact" data-i="ctaContact"></a></div>
    </div>
    <div class="portrait"><figure><img src="photo.jpg" alt="Ahmed Almakaidy, copywriter" width="640" height="800"><figcaption><i></i><span data-i="badge"></span></figcaption></figure></div>
  </div>

  <div class="trusted"><span class="t-label" data-i="trusted"></span><ul class="logos"><li><img src="img/logo-faei.png" alt="Fun and Easy Italian" height="26"></li><li class="pi"><img src="img/logo-pi.png" alt="" height="36"><span>Passione Italiana</span></li><li><img src="img/logo-hoy.png" alt="House of Yas" height="19"></li></ul></div>

  <section id="work">
    <div class="sec-head"><div class="eyebrow" data-i="wEyebrow"></div><h2 data-i="wH2"></h2></div>
    <div class="bento" id="bento"></div>

function renderBento(){
  const b = $("#bento"); b.innerHTML = "";
  Object.entries(CATS).forEach(([k,c])=>{
    const card = el("button","bc "+c.cls); card.type = "button"; card.setAttribute("aria-pressed", CAT===k);
    const txt = el("div"); txt.append(el("div","n",countLabel(catCount(k))), el("div","t",c[L][0]), el("div","s",c[L][1]));

/* ============ case studies ============ */
function renderCases(){
  const box = $("#caseList"); box.innerHTML = "";
  CASES.filter(c=>(W==="ALL"||c.langs.includes(W)) && (CAT==="all"||c.cat===CAT)).forEach((c,ci)=>{
    const art = el("article","case");
    const stack = el("button","stack"); stack.type = "button"; stack.setAttribute("aria-label", t("open")+": "+c.title);
    const pgs = el("div","pgs"); c.cover.forEach(src=>pgs.append(docImg(src,""))); stack.append(pgs, el("span","open",t("open")+" →"));
    stack.addEventListener("click",()=>openViewer(c.title, c.langs, c.kind[L], c.docs));
    const st = el("div","story");
    const num = el("div","num"); num.append(el("b",null,String(ci+1).padStart(2,"0")), ...c.langs.map(langTag), el("span",null,c.kind[L]));
    const dl = el("dl","kv");
    [["client",c.client[L]],["goal",c.goal[L]],["did",c.did[L]],["angle",c.angle[L]]].forEach(([k,v])=>{ const d = el("div"); d.append(el("dt",null,t(k)), el("dd",null,v)); dl.append(d); });
    const b = el("button","btn sun",t("readCopy")+" →"); b.type = "button";
    b.addEventListener("click",()=>openViewer(c.title, c.langs, c.kind[L], c.docs));
    st.append(num, el("h3",null,c.title), dl, b);
    art.append(stack, st); box.append(art);
  });
}

/* ============ more work ============ */
function renderFilters(){
  const f = $("#filters"); f.innerHTML = "";
  const have = new Set(DATA.more.filter(w=>W==="ALL"||w.lang===W).map(w=>w.type));
  if (fType!=="all" && !have.has(fType)) fType = "all";
  Object.entries(t("types")).filter(([v])=>v==="all"||have.has(v)).forEach(([v,label])=>{
    const c = el("button","chip",label); c.type = "button"; c.setAttribute("aria-pressed", v===fType);
    c.addEventListener("click",()=>{ fType = v; renderFilters(); renderGallery(); }); f.append(c);
  });
}
function renderGallery(){
  const g = $("#gallery"); g.innerHTML = "";
  const first = L==="it" ? "IT" : "EN";
  const items = DATA.more.map((w,i)=>[w,i]).filter(([w])=>(W==="ALL"||w.lang===W) && (CAT==="all"||TYPE2CAT[w.type]===CAT))
    .sort((a,b)=>(a[0].lang===first?0:1)-(b[0].lang===first?0:1) || a[1]-b[1]);
  items.forEach(([w])=>{
    const kind = L==="it" ? (KIND_IT[w.kind]||w.kind) : w.kind;
    const client = L==="it" ? (CLIENT_IT[w.client]||w.client) : w.client;
    const li = el("li","tile"), b = el("button"); b.type = "button";
    const th = el("div","thumb"); th.append(docImg(w.pages[0], w.title));
    const meta = el("div","meta"); meta.append(langTag(w.lang), el("span",null,kind+" · "+t("pages")(w.pages.length)));
    b.append(th, meta, el("span","t",w.title), el("span","job",L==="it"&&w.jobIt?w.jobIt:w.job));
    b.addEventListener("click",()=>openViewer(w.title,[w.lang],kind+" · "+client,[{en:"",it:"",lang:w.lang,pages:w.pages}]));
    li.append(b); g.append(li);
  });
  const a = $("#also"); a.innerHTML = "";
  a.hidden = !(W!=="IT" && (CAT==="all"||CAT==="articles"));
  a.append(el("b",null,t("also")), DATA.also.join("  ·  "));
}

/* ============ language tabs ============ */
function renderTabs(){
  const box = $("#langTabs"); box.innerHTML = "";
  ["ALL","EN","IT"].forEach(lg=>{
    const b = el("button","langtab "+lg); b.type = "button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", lg===W);
    if (lg!=="ALL") b.append(langTag(lg));
    b.append(el("span",null,t("tab"+lg)));
    b.addEventListener("click",()=>{ W = lg; renderAllWork(); });
    box.append(b);
  });
}

function revCard(r){
  const c = el("figure","rev");
  const body = el("div","body"), q = el("q","clamp",r.text); body.append(q);
  let tr = null;
  if (r.tr && L==="en"){ tr = el("div","tr"); tr.append(el("b",null,"Translated: "), r.tr); tr.hidden = true; body.append(tr); }
  const more = el("button","more",tr ? t("showTr") : t("readMore")); more.type = "button"; more.hidden = !tr;
  more.addEventListener("click",()=>{
    if (tr){ tr.hidden = !tr.hidden; more.textContent = tr.hidden ? t("showTr") : t("readLess"); return; }
    const open = q.classList.toggle("clamp"); more.textContent = open ? t("readMore") : t("readLess"); });
  body.append(more); c.append(body);
  requestAnimationFrame(()=>{ if (!tr && q.scrollHeight > q.clientHeight + 2) more.hidden = false; });
  const who = el("figcaption","who"), av = el("div","av");
  if (r.img){ const i = el("img"); i.src = r.img; i.alt = ""; i.loading = "lazy"; av.append(i); } else av.textContent = r.initials;
  const txt = el("div"); txt.append(el("b",null,r.name), el("small",null,r.role[L]));
  const src = el("span","src "+r.src);
  const key = r.src==="other" ? r.ic : r.src;
  src.innerHTML = ICONS[key];
  src.append(r.src==="linkedin" ? "LinkedIn" : r.src==="fiverr" ? "Fiverr" : r.srcLabel[L]);
  const line = el("div"); line.style.cssText = "display:flex;align-items:center;gap:6px;flex-wrap:wrap"; line.append(src);
  if (r.stars){ const st = el("span","stars","★★★★★"); st.setAttribute("aria-label","5 out of 5"); line.append(st); }
  txt.append(line); who.append(av, txt); c.append(who);
  return c;
}
function renderReviews(){
  const g = $("#revGrid"); g.innerHTML = "";
  REVIEWS.forEach(r=>g.append(revCard(r)));
}

/* ============ viewer ============ */
const dlg = $("#viewer");
function openViewer(title, langs, sub, docs){
  $("#vTitle").textContent = title;
  const m = $("#vMeta"); m.innerHTML = ""; m.append(...langs.map(langTag), el("span",null,sub));
  const bar = $("#vDocs"); bar.innerHTML = ""; bar.hidden = docs.length < 2;
  const show = i => {
    [...bar.children].forEach((x,j)=>x.setAttribute("aria-pressed", j===i));
    const p = $("#vPages"); p.innerHTML = "";
    docs[i].pages.forEach((src,k)=>p.append(docImg(src, title+" · "+(k+1))));
    dlg.scrollTop = 0;
  };
  docs.forEach((d,i)=>{ const b = el("button",null,d[L]); b.type = "button"; b.addEventListener("click",()=>show(i)); bar.append(b); });
  show(0);
  if (typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
}
$("#closeBtn").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if (e.target===dlg) dlg.close(); });

/* ============ language ============ */
function applyLang(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach(n=>{ n.textContent = t(n.dataset.i); });
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===L));
  $("#copyBtn").textContent = t("copy"); $("#closeBtn").textContent = t("close")+" ✕";
  const svc = $("#svc"); svc.innerHTML = "";
  t("svc").forEach(([a,b])=>{ const li = el("li"); li.append(el("b",null,a), el("span",null,b)); svc.append(li); });
  renderAllWork(); renderReviews();
}
document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{ L = b.dataset.lang; try{localStorage.setItem("lang",L);}catch(e){} applyLang(); }));
applyLang();

$("#copyBtn").addEventListener("click",async()=>{
  const btn = $("#copyBtn"), txt = $("#addr").textContent;
  try { await navigator.clipboard.writeText(txt); btn.textContent = t("copied"); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($("#addr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t("selected"); }
  setTimeout(()=>btn.textContent = t("copy"),2500);
});
