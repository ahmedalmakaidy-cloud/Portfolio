<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed's Copy Portfolio</title>
<meta name="description" content="Ahmed, bilingual copywriter (English and Italian) for language-learning and education brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
<style>
/* Layout: dusk-sea hero panel with portrait; EN/IT switch flips the whole page; work as cards grouped by language */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202B; --muted:#5A6472; --line:#DCE0E6;
  --sun:#D9572197; --sunsolid:#DD5A22; --en:#2C5A92; --it:#2A7A52;
  --hero:#152030; --hero-fg:#F4EFE8; --hero-muted:#B8C0CC;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E28; --ink:#E9ECF1; --muted:#9AA4B2; --line:#283241;
  --sunsolid:#F07A45; --en:#8DB0E6; --it:#7CCB9F; --hero:#1A2638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E28; --ink:#E9ECF1; --muted:#9AA4B2; --line:#283241;
  --sunsolid:#F07A45; --en:#8DB0E6; --it:#7CCB9F; --hero:#1A2638; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px}
a{color:inherit}
:focus-visible{outline:2px solid var(--sunsolid);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sunsolid)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--sunsolid)}
.top-r{display:flex;align-items:center;gap:22px}
.top nav{display:flex;gap:20px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px}
.top nav a:hover{color:var(--ink)}
.switch{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;padding:3px}
.switch button{font:600 13px var(--ui);letter-spacing:.06em;border:0;background:none;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-fg);border-radius:24px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:40px;align-items:center;padding:56px 52px;margin-top:6px}
.hero::before{content:"";position:absolute;width:520px;height:520px;right:-120px;bottom:-260px;background:radial-gradient(circle,rgba(240,122,69,.55),rgba(240,122,69,0) 65%);pointer-events:none}
.hero > *{position:relative}
.hero .eyebrow{color:#F3A06F}
.hero h1{font-size:clamp(36px,5.4vw,66px);font-weight:800;letter-spacing:-.025em;margin-top:14px}
.hero .other{font-family:var(--read);font-style:italic;font-size:clamp(18px,2.1vw,24px);color:var(--hero-muted);margin:14px 0 0;max-width:34ch}
.hero .other b{font-family:var(--ui);font-style:normal;font-size:11px;font-weight:600;letter-spacing:.1em;border:1px solid currentColor;border-radius:4px;padding:1px 5px;margin-right:8px;vertical-align:.25em}
.hero .lede{color:var(--hero-muted);max-width:52ch;margin:22px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--ui);padding:13px 22px;border-radius:999px;text-decoration:none;cursor:pointer;border:1.5px solid currentColor;background:transparent;color:inherit;transition:transform .15s}
.btn.sun{background:#F07A45;border-color:#F07A45;color:#1A1410}
.btn:hover{transform:translateY(-2px)}
.portrait{justify-self:end;width:100%;max-width:330px}
.portrait figure{margin:0;position:relative}
.portrait img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:20px;border:4px solid rgba(255,255,255,.12)}
.portrait figcaption{position:absolute;left:-18px;bottom:22px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.portrait figcaption i{width:8px;height:8px;border-radius:50%;background:#3BBF6E;flex:none}

section{padding-block:72px 8px}
.sec-head{display:grid;gap:8px;margin-bottom:28px}
.sec-head h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em}

.lang{font-size:11px;font-weight:600;letter-spacing:.08em;border:1.5px solid currentColor;border-radius:5px;padding:1px 6px;white-space:nowrap}
.lang.EN{color:var(--en)} .lang.IT{color:var(--it)}
.spec{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);background:var(--bg);border:1px dashed var(--muted);border-radius:5px;padding:1px 6px}

/* featured */
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;align-items:start}
.feat-info{display:grid;gap:16px}
.feat-info p{margin:0;color:var(--muted)}
.feat-info p.client{color:var(--ink);font-weight:600}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline;font-size:15.5px}
.steps .k{font-weight:600;color:var(--sunsolid);font-size:14px}
.viewer{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0;box-shadow:0 18px 50px -30px rgba(20,30,50,.35)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.tab{flex:none;font:500 13.5px var(--ui);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .lang{color:inherit}
.sheet{padding:26px 28px 32px;max-height:560px;overflow-y:auto}
.mailhead{display:grid;gap:4px;padding:12px 14px;margin-bottom:20px;background:var(--bg);border-radius:10px;font-size:14px;color:var(--muted)}
.mailhead b{color:var(--ink);font-weight:600}
.copy{white-space:pre-line;font-family:var(--read);font-size:16.5px;line-height:1.7;max-width:62ch}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{font:500 14px var(--ui);padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{margin-top:34px}
.group h3{font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center;margin-bottom:16px}
.group h3 small{font:500 14px var(--ui);color:var(--muted)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{height:100%}
.card button{all:unset;box-sizing:border-box;cursor:pointer;height:100%;width:100%;display:flex;flex-direction:column;gap:10px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:transform .15s,border-color .15s}
.card button:hover{transform:translateY(-3px);border-color:var(--sunsolid)}
.card button:focus-visible{outline:2px solid var(--sunsolid);outline-offset:2px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.card .t{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.card .job{font-size:15px;color:var(--muted);flex:1}
.card .foot{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.card .foot b{color:var(--sunsolid);font-weight:600;white-space:nowrap}
.also{margin-top:16px;padding:18px 22px;border:1px dashed var(--line);border-radius:16px;font-size:14.5px;color:var(--muted)}
.also b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.empty{color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px}
.about p{margin:0 0 16px;max-width:60ch}
.svc{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.svc li{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;gap:2px}
.svc b{font-family:var(--display);font-weight:600;font-size:18px}
.svc span{font-size:15px;color:var(--muted)}

/* contact */
.contact{margin-block:72px 24px;background:var(--hero);color:var(--hero-fg);border-radius:24px;padding:52px;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;width:420px;height:420px;left:-140px;top:-220px;background:radial-gradient(circle,rgba(240,122,69,.45),rgba(240,122,69,0) 65%)}
.contact > *{position:relative}
.contact .eyebrow{color:#F3A06F}
.contact h2{font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-.02em;max-width:20ch;margin-top:10px}
.mailbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.addr{font-size:17px;padding:12px 18px;border:1px solid rgba(255,255,255,.25);border-radius:999px;user-select:all;word-break:break-all}
footer{padding-block:20px 36px;color:var(--muted);font-size:14px}

/* reader */
dialog{border:none;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 30px 90px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,22,.6)}
.dlg-top{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dlg-top h3{font-size:23px;font-weight:600;margin-top:6px}
.dlg-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.close{flex:none;font:500 14px var(--ui);background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:7px 14px;cursor:pointer}
.dlg-body{padding:22px 24px 34px}
.note{background:var(--bg);border-left:3px solid var(--sunsolid);border-radius:0 10px 10px 0;padding:12px 14px;margin:0 0 20px;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding:36px 24px 32px;gap:28px}
  .portrait{justify-self:start;max-width:250px;order:-1}
  .portrait figcaption{left:14px;right:auto;bottom:-16px;white-space:nowrap}
  .portrait{margin-bottom:12px}
  .feat,.about{grid-template-columns:1fr;gap:28px}
  .grid{grid-template-columns:1fr}
  .top nav{display:none}
  .contact{padding:36px 24px}
  .sheet{padding:20px 18px 26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.btn:hover,.card button:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#top" id="top">Ahmed<span>.</span></a>
    <div class="top-r">
      <nav><a href="#featured" data-i="navF"></a><a href="#work" data-i="navW"></a><a href="#about" data-i="navA"></a><a href="#contact" data-i="navC"></a></nav>

{tab:"Sales page · EN", lang:"EN", subject:null, body:`LEARN ITALIAN
the natural and fun way, with short dialogues!

Have you decided to learn Italian? That's awesome!

A leisure trip to Italy?
Meeting your friends living in Italy?
A work or study experience?
Learning the language of your parents, grandparents or ancestors?

Whatever your reason, one thing is clear:
YOU WANT TO SPEAK ITALIAN!
And you definitely want to sound natural and confident.
Let me tell you how you can achieve your goal.

IMMERSION IS THE KEY TO LEARNING ITALIAN
(and other languages)

Why are Italian children able to communicate easily in Italian?
Because they are immersed in it!
They listen every day to real-life conversations.
You can do the same, and faster!

How?
You too can immerse yourself in the Italian language by listening to and reading conversations from everyday life!

Introducing…
ITALIAN CONVERSATIONS FOR BEGINNERS

What's inside?
• 250+ short, real and fun conversations. Each dialogue is based on daily Italian life. Simple enough for beginners, yet natural and authentic.
• 21 themed units: greetings, the weather, at the bar, restaurant, post office and bank, shopping, travelling, sport, health, colloquial Italian, and many more everyday situations!
• High-quality audio for every conversation, recorded by the author (Italian native speaker).
• Translation into English, so you understand every word and never feel lost!
• Instant download on any device.
• Free lifetime access and updates. Buy ONCE, own it FOREVER!

WHO IS THIS BOOK FOR?
This book is perfect for you if:
You're a complete beginner or at A1–A2 level.
You want to speak Italian, not just study grammar.
You've struggled to stay motivated with boring textbooks.
You love learning with real-life dialogues with audio.

Not for you if you are looking for a grammar course or advanced material.

WHY THIS METHOD WORKS
Many language learners struggle because they rely too much on memorizing vocabulary lists or studying grammar rules in isolation.
While those things have their place, they rarely help you speak confidently in real-life situations.

Think about how children learn their first language:
They don't sit down with grammar books.
They listen, observe, and absorb. And then, they speak the language!
You can do the same!

You need exposure to real language. And if you have fun, you learn faster!
That's why the conversations in my book are also funny.

{tab:"Day 2 · IT", lang:"IT", subject:"Stai affrontando questi ostacoli nell'apprendimento dell'italiano? 🚧", body:`Ciao (nome),

Imparare l'italiano può essere un percorso incredibile, ma non è sempre facile, lo so.

Se sei come molti, ti sarai trovato ad affrontare questi ostacoli:

• Frasi che sembrano impossibili da ricordare.
• La paura di fare errori: hai paura di parlare perché temi che gli altri ti correggano o che non capiscano quello che vuoi dire.
• Poca fiducia nell'usare l'italiano: puoi capire la lingua quando la senti, ma parlare? È tutta un'altra cosa.

Il vero problema?
La maggior parte dei metodi di insegnamento non ti preparano a parlare italiano nella vita reale.

Non ti sei mai sentito pronto per parlare, non perché non conosci le parole, ma perché il metodo che segui ti sta limitando.

Ecco come il mio metodo ti aiuterà:
1. Impara a parlare subito, fin dal primo giorno.
2. Frasi utili e reali che puoi usare ogni giorno.

{tab:"Day 4 · IT", lang:"IT", subject:"Il metodo più efficace per imparare l'italiano", body:`Ciao (nome),

Ti sei mai chiesto perché tanti metodi di apprendimento delle lingue non funzionano?

 body:`No doubt learning English has become a necessity in today's world, not just a hobby you do when you have the time.

{type:"content", lang:"EN", kind:"Blog article", title:"Why Is Your Brain Showing You a Smiling Coffee?", client:"Popular science blog",
 job:"Explains pareidolia through an everyday moment, so a science topic reads like a story.",
 jobIt:"Spiega la pareidolia partendo da un momento quotidiano, così un tema scientifico si legge come una storia.", excerpt:true,
 body:`Imagine this: it's the weekend, and you go out with your friends. You order a cup of coffee and, right before the first sip, you notice something…

Your coffee is smiling at you.

You feel weird, because coffees are not supposed to do that. And you don't know if you can tell your friends, or if they'll call you crazy.

So, are you really crazy, or is this coffee actually smiling?

Pareidolia
What you just experienced is perfectly normal. It's called pareidolia, and it's a masterpiece of our amazing brains: the tendency to see familiar patterns, often faces, in random things.

You can experience it almost everywhere. Faces in the clouds. Shapes in your toast. A judgmental look from your sink. Popcorn giving you a death stare.

…

The full article covers famous examples (the "Face on Mars", the grilled-cheese sandwich that sold for $28,000), the survival reason behind it, and the brain area responsible.`},

{type:"content", lang:"EN", kind:"Blog article", title:"Neuroplasticity: How Do We Learn New Things?", client:"Popular science blog",
 job:"Breaks down how the brain rewires itself, in plain language, and ties it back to learning a language.",
 jobIt:"Spiega con parole semplici come il cervello si riorganizza e lo collega all'apprendimento delle lingue.", excerpt:true,
 body:`The brain, with its billions of neurons, is by far the most complicated structure humans have ever explored.

There is a long-standing belief that the brain doesn't change. Modern neuroscience has proven this wrong. The brain has an amazing capacity to change and adapt, a phenomenon called neuroplasticity.

Neuroplasticity is the brain's ability to reorganize its structure, function and connections in response to what happens inside and around us.

For example, when you learn a new language, your brain creates new connections between neurons to let you do it. The more you practice every day, the stronger those connections become, and the easier and more familiar the language feels.

…

The full article covers how neurons communicate, the role of repetition, and how the brain rebuilds routes after an injury.`},

{type:"content", lang:"EN", kind:"Blog article", title:"Memories Are Made by \"Damaging\" Our DNA", client:"Popular science blog",
 job:"Turns a 2024 Nature study into a clear, readable story for a general audience.",
 jobIt:"Trasforma uno studio pubblicato su Nature in una storia chiara per un pubblico generale.", excerpt:true,
 body:`Our memories form when certain neurons in the hippocampus, the area responsible for memory, change in response to what we experience.

This process takes a lot of energy and causes big biochemical changes inside the cells. These changes are believed to cause breaks, or "damage", in our DNA.

A study in mice, published in Nature, found that when long-term memory is forming, some neurons go through a burst of electrical activity strong enough to break their DNA. An inflammatory response follows, repairs the damage, and helps lock the memory in.

Usually, when we hear "DNA damage" we think of diseases like cancer. Here, the cycle of damage and repair may explain how memories are made.

…

The full article walks through the experiment, the role of the TLR9 protein, and what it could mean for future treatments.`}
];

const KIND_IT={"Landing page":"Landing page","Newsletter":"Newsletter","Promo email":"Email promozionale","Sales email":"Email di vendita","Welcome email":"Email di benvenuto","Sequence opener":"Email di apertura","Newsletter · 2 drafts":"Newsletter · 2 bozze","Lead magnet email":"Email lead magnet","Blog article":"Articolo di blog"};

/* ============================================================ */
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const langTag = l => el("span","lang "+l,l);
let L = "en", fType = "all", tabIdx = 0;
try { const s = localStorage.getItem("lang"); if (s==="it"||s==="en") L = s; } catch(e){}
if (location.hash === "#it") L = "it";
const t = k => T[L][k];
const kindOf = w => L==="it" ? (KIND_IT[w.kind]||w.kind) : w.kind;
const clientOf = w => L==="it" ? (CLIENT_IT[w.client]||w.client) : w.client;
const jobOf = w => L==="it" && w.jobIt ? w.jobIt : w.job;

function mailHead(subject, subjects){
  const h = el("div","mailhead");
  const list = subjects || (subject ? [subject] : []);
  list.forEach((s,i)=>{ const d = el("div"); d.append(t("subject")+(list.length>1?" "+String.fromCharCode(65+i):"")+": "); d.append(el("b",null,s)); h.append(d); });
  return h;
}

/* featured */
function tabOrder(){ const idx = LAUNCH.map((_,i)=>i); return L==="it" ? [1,2,3,4,5,6,0] : idx; }
function renderFeatured(){
  const steps = $("#steps"); steps.innerHTML = "";
  t("steps").forEach(([k,v])=>{ const li = el("li"); li.append(el("span","k",k), el("span",null,v)); steps.append(li); });
  const tabs = $("#tabs"); tabs.innerHTML = "";
  tabOrder().forEach(i=>{
    const b = el("button","tab"); b.type = "button"; b.setAttribute("role","tab"); b.dataset.i = i;
    b.append(el("span",null,t("tabs")[i]), langTag(LAUNCH[i].lang));
    b.addEventListener("click",()=>showTab(i)); tabs.append(b);
  });
  showTab(tabOrder()[0]);
}
function showTab(i){
  tabIdx = i;
  [...$("#tabs").children].forEach(b=>b.setAttribute("aria-selected", +b.dataset.i===i));
  const p = LAUNCH[i], s = $("#sheet"); s.innerHTML = ""; s.scrollTop = 0;
  if (p.subject) s.append(mailHead(p.subject));
  s.append(el("div","copy",p.body));
}

/* filters + groups */
function renderFilters(){
  const f = $("#filters"); f.innerHTML = "";
  Object.entries(t("types")).forEach(([v,label])=>{
    const c = el("button","chip",label); c.type = "button"; c.setAttribute("aria-pressed", v===fType);
    c.addEventListener("click",()=>{ fType = v; renderFilters(); renderWork(); }); f.append(c);
  });
}
function card(w,i){
  const li = el("li","card"), b = el("button"); b.type = "button";
  const meta = el("div","meta"); meta.append(langTag(w.lang), el("span",null,kindOf(w)));
  if (w.spec){ const s = el("span","spec",t("spec")); s.title = t("specTip"); meta.append(s); }
  const foot = el("div","foot"); foot.append(el("span",null,clientOf(w)), el("b",null,t("read")+" →"));
  b.append(meta, el("span","t",w.title), el("span","job",jobOf(w)), foot);
  b.addEventListener("click",()=>openPiece(i)); li.append(b); return li;
}
function renderWork(){
  const g = $("#groups"); g.innerHTML = "";
  const order = L==="it" ? ["IT","EN"] : ["EN","IT"];
  let total = 0;
  order.forEach(lang=>{
    const items = WORK.map((w,i)=>[w,i]).filter(([w])=>w.lang===lang && (fType==="all"||w.type===fType));
    const showAlso = lang==="EN" && (fType==="all"||fType==="content") && ALSO.length;
    if (!items.length && !showAlso) return;
    total += items.length;
    const box = el("div","group");
    const h = el("h3"); h.append(langTag(lang), el("span",null,t(lang==="EN"?"groupEN":"groupIT")), el("small",null,t("pieces")(items.length)));
    box.append(h);
    const ul = el("ul","grid"); items.forEach(([w,i])=>ul.append(card(w,i))); box.append(ul);
    if (showAlso){ const a = el("div","also"); a.append(el("b",null,t("also")), ALSO.join("  ·  ")); box.append(a); }
    g.append(box);
  });
  if (!total && !g.children.length) g.append(el("p","empty",t("empty")));
}

/* reader */
const dlg = $("#reader");
function openPiece(i){
  const w = WORK[i];
  const meta = $("#dlgMeta"); meta.innerHTML = "";
  meta.append(langTag(w.lang), el("span",null,kindOf(w)+" · "+clientOf(w)));
  if (w.spec){ const s = el("span","spec",t("spec")); s.title = t("specTip"); meta.append(s); }
  $("#dlgTitle").textContent = w.title;
  const body = $("#dlgBody"); body.innerHTML = "";
  const n = el("p","note"); n.append(el("b",null,t("job"))); n.append(jobOf(w)); body.append(n);
  if (w.type==="email") body.append(mailHead(w.title, w.subjects));
  body.append(el("div","copy",w.body));
  if (typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
  dlg.scrollTop = 0;
}
$("#closeBtn").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if (e.target===dlg) dlg.close(); });

/* language switch */
function applyLang(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-i]").forEach(n=>{ n.textContent = t(n.dataset.i); });
  $("#otherTag").textContent = L==="en" ? "IT" : "EN";
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===L));
  $("#copyBtn").textContent = t("copy"); $("#closeBtn").textContent = t("close")+" ✕";
  const svc = $("#svc"); svc.innerHTML = "";
  t("svc").forEach(([a,b])=>{ const li = el("li"); li.append(el("b",null,a), el("span",null,b)); svc.append(li); });
  renderFeatured(); renderFilters(); renderWork();
}
document.querySelectorAll(".switch button").forEach(b=>b.addEventListener("click",()=>{
  L = b.dataset.lang; try { localStorage.setItem("lang",L); } catch(e){} applyLang();
}));
applyLang();

/* copy email */
$("#copyBtn").addEventListener("click",async()=>{
  const btn = $("#copyBtn"), txt = $("#addr").textContent;
  try { await navigator.clipboard.writeText(txt); btn.textContent = t("copied"); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($("#addr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t("selected"); }
  setTimeout(()=>btn.textContent = t("copy"),2500);
});
</script>
